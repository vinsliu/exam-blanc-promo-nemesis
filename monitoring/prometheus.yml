global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert.rules.yml

scrape_configs:
  # Nom du service tel qu'il apparaît dans docker-compose.yml : si ce
  # fichier est utilisé avec un Prometheus branché sur le même réseau
  # Docker que la stack applicative, "backend" se résout automatiquement.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
