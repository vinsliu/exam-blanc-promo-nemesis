server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue (ex: /tasks après un rechargement de page)
    # doit retomber sur index.html, sinon React Router ne peut pas la gérer
    # côté client et nginx renverrait une 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
